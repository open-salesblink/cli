name: Build binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild binaries for (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Each binary is built on its own OS: pkg cannot generate V8 bytecode when
  # cross-compiling, and macOS binaries must be (ad-hoc) signed on macOS.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  target: node22-linux-x64,   out: salesblink-linux-x64 }
          - { os: macos-14,       target: node22-macos-arm64, out: salesblink-macos-arm64 }
          - { os: macos-15-intel, target: node22-macos-x64,   out: salesblink-macos-x64 }
          - { os: windows-latest, target: node22-win-x64,     out: salesblink-win-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
        if: runner.os != 'Windows'
      - run: npm test

      - name: Build binary
        run: npx pkg src/index.js --compress GZip -t ${{ matrix.target }} --output release/${{ matrix.out }}

      - name: Smoke test binary
        shell: bash
        run: |
          version=$(./release/${{ matrix.out }} --version)
          echo "binary reports $version"
          test "v$version" = "$TAG"
          ./release/${{ matrix.out }} --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: release/${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release, or replace binaries on an existing one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber release/salesblink-*
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --generate-notes release/salesblink-*
          fi
